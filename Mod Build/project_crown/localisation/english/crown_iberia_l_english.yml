 spanish_nation_desc:0 "The Iberian culture-states have fought, bargained, and endured as separate crowns. A ruler who holds the decisive Castilian, Aragonese, Catalan, Leonese, Galician, Basque, and Granadan centers can bind the non-Portuguese peninsula into Spain."
